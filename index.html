<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像クイズゲーム</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --success-color: #10b981;
            --error-color: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            padding: 24px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        /* 画面切り替え用 */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* 漫画選択部分 */
        .genre-select {
            background-color: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .genre-select p {
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        .radio-group input[type="radio"] {
            transform: scale(1.2);
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        /* クイズ画面 */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .image-container {
            width: 100%;
            height: 500px;
            background-color: #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-contaier img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 16px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input[type="number"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* サブボタン（漫画再選択用などのスタイル） */
        .secondary-btn {
            background-color: #6b7280;
        }
        .secondary-btn:hover {
            background-color: #4b5563;
        }

        /* フィードバック表示 */
        #feedback {
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 30px;
            margin-top: 10px;
        }

        .correct {
            color: var(--success-color);
        }

        .incorrect {
            color: var(--error-color);
        }

        /* リザルト画面 */
        .result-card {
            text-align: center;
            padding: 10px 0 20px 0;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 15px 0;
        }

        .result-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .restart-btn {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- スタート画面 -->
        <div id="start-screen" class="screen active">
            <h1>表紙クイズ</h1>
            <p style="text-align: center; margin-bottom: 16px; color: #4b5563;">
                何巻の表紙か当ててね（全10問）
            </p>

            <!-- 漫画選択ラジオボタン -->
            <div class="genre-select">
                <p>📌 漫画を選択:</p>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="genre" value="onepiece1" checked> 
                        ワンピース（60巻まで）
                    </label>
                    <label>
                        <input type="radio" name="genre" value="onepiece2" checked> 
                        ワンピース（115巻まで）
                    </label>
                    <label>
                        <input type="radio" name="genre" value="conan" checked> 
                        コナン（60巻まで）
                    </label>
                    <label>
                        <input type="radio" name="genre" value="zan"> 
                        斬（全2巻）
                    </label>
                </div>
            </div>

            <button class="restart-btn" onclick="startQuiz()">ゲームスタート</button>
        </div>

        <!-- クイズ画面 -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="question-count">第 1 問 / 全 10 問</span>
                <span id="score-count">スコア: 0</span>
            </div>
            
            <div class="image-container">
                <img id="quiz-image" src="" alt="クイズ画像">
            </div>

            <div class="input-group">
                <input type="number" id="answer-input" placeholder="半角数字で入力" autocomplete="off">
                <button id="submit-btn" onclick="checkAnswer()">回答</button>
            </div>

            <div id="feedback"></div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="screen">
            <h1>結果発表</h1>
            <div class="result-card">
                <p>すべての問題が終了しました！</p>
                <div class="score-display" id="final-score">0 / 10</div>
            </div>

            <!-- リザルト画面のボタン群 -->
            <div class="result-buttons">
                <!-- 直前の漫画でもう一度遊ぶ -->
                <button class="restart-btn" onclick="startQuiz()">同じ漫画でもう一度遊ぶ</button>
                <!-- スタート画面に戻って漫画を再選択する（直前の漫画にチェックが入った状態） -->
                <button class="restart-btn secondary-btn" onclick="goToStartScreen()">漫画を選び直す</button>
            </div>
        </div>
    </div>

    <script>
        // 漫画別のクイズデータ集
        function generateQuizData(folderName, count) {
            const data = [];
            for (let i = 1; i <= count; i++) {
                data.push({
                    image: `image\\${folderName}\\${i}.jpg`,
                    answers: [String(i)],
                    question: ""
                });
            }
            return data;
        }
        
        const quizDataMap = {
            onepiece1: generateQuizData("onepiece", 60),
            onepiece2: generateQuizData("onepiece", 115),
            conan: generateQuizData("conan", 60),
            zan: generateQuizData("zan", 2)
        };

        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;
        let activeQuizData = []; 
        let currentGenre; // 現在選択/プレイ中の漫画を保持
        const QUESTION_LIMIT = 10; 

        // 画面切り替え関数
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // ゲームスタート
        function startQuiz() {
            // もしスタート画面から呼び出された場合は、ラジオボタンの選択を反映する
            // リザルト画面から「同じ漫画でもう一度遊ぶ」で呼び出された場合は、currentGenreをそのまま維持する
            const startScreenEl = document.getElementById('start-screen');
            if (startScreenEl.classList.contains('active')) {
                const selectedRadio = document.querySelector('input[name="genre"]:checked');
                if (selectedRadio) {
                    currentGenre = selectedRadio.value;
                }
            }

            const targetData = quizDataMap[currentGenre];

            if (!targetData || targetData.length === 0) {
                alert("選択された漫画のデータがありません！");
                return;
            }

            // データをランダムにシャッフル
            const shuffled = [...targetData].sort(() => Math.random() - 0.5);
            const limit = Math.min(QUESTION_LIMIT, targetData.length);
            activeQuizData = shuffled.slice(0, limit);

            currentQuestionIndex = 0;
            score = 0;
            showScreen('quiz-screen');
            loadQuestion();
        }

        // スタート画面に戻り、直前に遊んだ漫画に初期選択を入れる
        function goToStartScreen() {
            const radios = document.querySelectorAll('input[name="genre"]');
            radios.forEach(radio => {
                if (radio.value === currentGenre) {
                    radio.checked = true;
                }
            });
            showScreen('start-screen');
        }

        // 問題の読み込み
        function loadQuestion() {
            isAnswered = false;
            const currentData = activeQuizData[currentQuestionIndex];

            document.getElementById('quiz-image').src = currentData.image;

            document.getElementById('question-count').textContent = `第 ${currentQuestionIndex + 1} 問 / 全 ${activeQuizData.length} 問`;
            document.getElementById('score-count').textContent = `スコア: ${score}`;
            
            const inputField = document.getElementById('answer-input');
            inputField.value = '';
            inputField.disabled = false;
            inputField.focus();

            document.getElementById('feedback').textContent = '';
            document.getElementById('submit-btn').textContent = '回答';
        }

        // 回答チェック
        function checkAnswer() {
            if (isAnswered) {
                currentQuestionIndex++;
                if (currentQuestionIndex < activeQuizData.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
                return;
            }

            const inputField = document.getElementById('answer-input');
            const userAnswer = inputField.value.trim();
            const currentData = activeQuizData[currentQuestionIndex];

            if (userAnswer === "") {
                alert("答えを入力してください！");
                return;
            }

            isAnswered = true;
            inputField.disabled = true;

            const isCorrect = currentData.answers.includes(userAnswer);
            const feedbackEl = document.getElementById('feedback');

            if (isCorrect) {
                score++;
                feedbackEl.textContent = "⭕ 正解";
                feedbackEl.className = "correct";
            } else {
                // feedbackEl.textContent = `❌ 不正解…（正解: ${currentData.answers[0]}）`;
                feedbackEl.textContent = `❌ 不正解…`;
                feedbackEl.className = "incorrect";
            }

            document.getElementById('score-count').textContent = `スコア: ${score}`;
            
            if (currentQuestionIndex < activeQuizData.length - 1) {
                document.getElementById('submit-btn').textContent = '次へ ➔';
            } else {
                document.getElementById('submit-btn').textContent = '結果 ➔';
            }
        }

        // スマホでキーボードの「確定/Enter」を押したときの処理
        document.getElementById('answer-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        // 結果画面の表示
        function showResult() {
            showScreen('result-screen');
            document.getElementById('final-score').textContent = `${score} / ${activeQuizData.length}`;
        }
    </script>
</body>
</html>
